<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="piko">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2e3b36">
<title>piko</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Cormorant+Garamond:wght@300;400;500&subset=greek,latin&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{height:100%}
body{
  background:#2e3b36;
  background-image:
    radial-gradient(ellipse at 22% 18%,rgba(255,255,255,.045),transparent 58%),
    radial-gradient(ellipse at 78% 82%,rgba(255,255,255,.03),transparent 55%);
  font-family:'Klee One','Hiragino Sans',sans-serif;
  display:flex;flex-direction:column;
  color:rgba(255,255,255,.9);
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea{font-family:inherit}
.hide{display:none!important}

/* ── 上のバー ── */
#bar{
  padding:12px 14px 10px;
  padding-top:calc(12px + env(safe-area-inset-top));
  border-bottom:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.022);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
}
#back{background:none;border:0;color:rgba(255,255,255,.5);font-size:17px;padding:2px 4px}
#title{font-size:15px;color:#dfe6e0;flex:1;min-width:60px;font-family:'Cormorant Garamond',serif;letter-spacing:.05em}
#title.gr{
  text-align:center;font-size:18px;letter-spacing:.04em;
  font-family:'Cormorant Garamond',serif;font-weight:400;
  color:rgba(255,255,255,.72);
}
#tname{font-family:'Cormorant Garamond',serif;letter-spacing:.05em;font-size:17px}
#tname::placeholder{color:rgba(255,255,255,.32)}
#go,#newthread{font-size:17px;font-weight:400}
#title.home{
  text-align:center;font-size:22px;letter-spacing:.06em;
  font-family:'Cormorant Garamond','Times New Roman',serif;
  color:rgba(255,255,255,.82);padding:2px 0 4px;
}
.who{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%}
.nm{font-size:12px;color:#dfe6e0}
.gauge{width:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.gauge i{display:block;height:100%;background:rgba(255,255,255,.55);transition:width .6s}
.gauge i.hot{background:#e0a98c}
.out{opacity:.34}
.tool{background:none;border:0;color:rgba(255,255,255,.42);font-size:11px;padding:2px 3px}

/* ── スレッド一覧 ── */
#threads{flex:1;overflow-y:auto;padding:20px 16px}
.thread{
  padding:14px 16px;margin-bottom:10px;border-radius:5px;
  border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.03);
  display:flex;align-items:center;gap:10px;
}
.thread .t{flex:1}
.thread .t b{font-size:14.5px;font-weight:400;display:block}
.thread .t small{font-size:11px;color:rgba(255,255,255,.4);line-height:1.75;display:block;margin-top:3px}
.thread .x{background:none;border:0;color:rgba(255,255,255,.3);font-size:15px;padding:6px}
.thread .x.yes,.thread .x.no{
  font-size:12px;padding:7px 11px;border-radius:4px;
  border:1px solid rgba(255,255,255,.18);
  font-family:'Cormorant Garamond',serif;letter-spacing:.04em;
}
.thread .x.yes{color:#e0a98c}
.thread .x.no{color:rgba(255,255,255,.55);margin-left:6px}
.thread .t small.ask{color:rgba(255,255,255,.55)}
#newthread{
  font-family:'Cormorant Garamond',serif;letter-spacing:.05em;
  width:100%;padding:14px;border-radius:5px;
  border:1px dashed rgba(255,255,255,.24);background:none;
  color:rgba(255,255,255,.55);font-size:15px;margin-top:6px;
}

/* ── 招待 ── */
#invite{flex:1;overflow-y:auto;padding:18px 16px}
#invite h3{font-size:12.5px;font-weight:400;color:rgba(255,255,255,.45);margin:0 0 4px;letter-spacing:.06em;font-family:'Cormorant Garamond',serif}
.org{font-size:11px;color:rgba(255,255,255,.35);margin:18px 0 7px;letter-spacing:.08em;font-family:'Cormorant Garamond',serif}
.card{
  padding:11px 13px;margin-bottom:7px;border-radius:5px;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.025);
  display:flex;align-items:center;gap:10px;
}
.card.on{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.075)}
.card .f{font-size:16px}
.card .m{flex:1}
.card .m b{font-size:13.5px;font-weight:400;display:block}
.card .m small{font-size:10.5px;color:rgba(255,255,255,.38)}
.card .k{font-size:10px;color:rgba(255,255,255,.28);white-space:nowrap;font-family:'Cormorant Garamond',serif;letter-spacing:.03em}
.star{color:#e8c4a0}
#go{
  position:sticky;bottom:0;width:100%;padding:13px;margin-top:14px;
  border-radius:5px;border:1px solid rgba(255,255,255,.24);
  background:#3b4a44;color:rgba(255,255,255,.9);font-size:15px;
  font-family:'Cormorant Garamond',serif;letter-spacing:.05em;
}
#tname{
  width:100%;padding:11px 14px;border-radius:5px;margin-bottom:16px;
  border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.045);
  color:rgba(255,255,255,.92);font-size:14px;
}

/* ── 会話 ── */
#log{flex:1;overflow-y:auto;padding:18px 16px 8px}
#log::-webkit-scrollbar,#threads::-webkit-scrollbar,#invite::-webkit-scrollbar{width:0}
.msg{margin-bottom:14px;max-width:88%}
.msg .name{
  font-size:11px;margin-bottom:5px;padding-left:2px;height:12px;
  display:flex;align-items:center;gap:6px;cursor:pointer;
}
.pip{width:9px;height:9px;border-radius:50%;display:inline-block}
.msg .body{
  padding:2px 4px;font-size:15px;line-height:1.85;white-space:pre-wrap;
  text-shadow:0 0 1px rgba(255,255,255,.5);
}
.msg.leaving .body{color:rgba(255,255,255,.34);font-style:italic;text-shadow:none}
.card-id{
  font-size:10.5px;color:rgba(255,255,255,.4);padding:4px 4px 2px;
  line-height:1.8;font-family:'Cormorant Garamond',serif;letter-spacing:.04em;
}
#think{font-size:11.5px;color:rgba(255,255,255,.38);padding-left:2px}
.typing i{
  display:inline-block;width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,.5);margin-right:3px;
  animation:blip 1.1s infinite;
}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blip{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-2px)}}
.fault{color:#c9a08f;font-size:11px;margin-top:6px;line-height:1.6;word-break:break-word}

/* ── 入力 ── */
#foot{
  padding:10px 14px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.022);display:flex;gap:8px;align-items:flex-end;
}
#say{
  flex:1;padding:11px 15px;border-radius:5px;
  border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.045);
  font-size:15px;resize:none;max-height:150px;color:rgba(255,255,255,.92);
}
#say:focus,button:focus{outline:1px solid rgba(255,255,255,.3)}
#send{
  width:42px;height:42px;flex-shrink:0;border-radius:5px;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.85);font-size:16px;
}
</style>
</head>
<body>

<div id="bar">
  <button id="back" class="hide">&#8592;</button>
  <div id="title">&#960;&#943;&#954;&#959;</div>
</div>

<div id="threads"></div>
<div id="invite" class="hide"></div>
<div id="log" class="hide"></div>
<div id="foot" class="hide">
  <textarea id="say" rows="2"></textarea>
  <button id="send">&#8593;</button>
</div>

<script>
var WORKER = "https://piko-worker.stella-753-5271.workers.dev";
var TINTS = ["#a8c8d8","#e8c4a0","#b8d8b0","#d8b8d0","#c8c0e0","#e0c8b0"];
var TIRE = 0.17, LISTEN = 0.04, REST = 0.045;

var view = "threads";       // threads | invite | chat
var roster = [], threads = [];
var room = null, title = "", members = [], msgs = [];
var picked = [], calls = 0, maxDepth = 6;
var busy = false, faults = {}, openCard = null, pendingDel = null, thinker = null;

var $bar = document.getElementById("bar");
var $back = document.getElementById("back");
var $title = document.getElementById("title");
var $threads = document.getElementById("threads");
var $invite = document.getElementById("invite");
var $log = document.getElementById("log");
var $foot = document.getElementById("foot");
var $say = document.getElementById("say");
var $send = document.getElementById("send");

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return c === "&" ? "&amp;" : c === "<" ? "&lt;" : c === ">" ? "&gt;" : "&quot;";
  });
}
function show(v){
  view = v;
  $threads.classList.toggle("hide", v !== "threads");
  $invite.classList.toggle("hide", v !== "invite");
  $log.classList.toggle("hide", v !== "chat");
  $foot.classList.toggle("hide", v !== "chat");
  $back.classList.toggle("hide", v === "threads");
}
function seatOf(id){
  for (var i = 0; i < members.length; i++) if (members[i].id === id) return members[i];
  return null;
}
function infoOf(id){
  for (var i = 0; i < roster.length; i++) if (roster[i].id === id) return roster[i];
  return null;
}

/* ── 上のバー ── */
function drawBar(){
  if (view !== "chat"){
    if (view === "invite"){
      $title.textContent = "\u03c0\u03bf\u03b9\u03bf\u03b9 \u03b5\u03af\u03bd\u03b1\u03b9 \u03b5\u03b4\u03ce;";
      $title.className = "gr";
    } else {
      $title.textContent = "\u03c0\u03af\u03ba\u03bf";
      $title.className = "home";
    }
    var old = $bar.querySelectorAll(".who,.tool");
    for (var q = 0; q < old.length; q++) old[q].remove();
    return;
  }
  $title.textContent = title || "\u03cc\u03bd\u03bf\u03bc\u03b1";
  $title.className = "";
  $title.onclick = rename;
  $title.style.cursor = "pointer";
  var olds = $bar.querySelectorAll(".who,.tool");
  for (var r = 0; r < olds.length; r++) olds[r].remove();
  for (var i = 0; i < members.length; i++){
    var m = members[i];
    var d = document.createElement("div");
    d.className = "who" + (m.out ? " out" : "");
    d.innerHTML = '<span class="dot" style="background:' + m.tint + '"></span>'
      + (m.name ? '<span class="nm">' + esc(m.name) + "</span>" : "")
      + '<span class="gauge"><i class="' + (m.fatigue > 0.7 ? "hot" : "")
      + '" style="width:' + (m.fatigue * 100) + '%"></i></span>';
    $bar.appendChild(d);
  }
  var c = document.createElement("button");
  c.className = "tool";
  c.style.marginLeft = "auto";
  c.textContent = calls + "\u56de";
  $bar.appendChild(c);
}

/* ── スレッド一覧 ── */
function drawThreads(){
  var h = "";
  for (var i = 0; i < threads.length; i++){
    var t = threads[i];
    var faces = t.seats.map(function(s){
      var r = infoOf(s);
      return r ? r.flag + " " + r.label : s;
    }).join(" \u30fb ");
    if (pendingDel === t.room){
      h += '<div class="thread"><div class="t"><b>' + esc(t.title || "untitled") + "</b>"
        + '<small class="ask">close this \u03c0\u03b1\u03c1\u03ad\u03b1 for good?</small></div>'
        + '<button class="x yes" data-yes="' + esc(t.room) + '">close</button>'
        + '<button class="x no">keep</button></div>';
    } else {
      h += '<div class="thread"><div class="t" data-room="' + esc(t.room) + '">'
        + "<b>" + esc(t.title || "untitled") + "</b>"
        + "<small>" + esc(faces || "nobody yet") + "</small>"
        + '</div><button class="x" data-del="' + esc(t.room) + '">\u00d7</button></div>';
    }
  }
  h += '<button id="newthread">open a new \u03c0\u03af\u03ba\u03bf</button>';
  $threads.innerHTML = h;

  var ts = $threads.querySelectorAll(".t");
  for (var a = 0; a < ts.length; a++){
    ts[a].onclick = function(){ enter(this.getAttribute("data-room")); };
  }
  var xs = $threads.querySelectorAll(".x");
  for (var b = 0; b < xs.length; b++){
    xs[b].onclick = function(){
      if (this.className.indexOf("yes") !== -1){
        var r = this.getAttribute("data-yes");
        pendingDel = null;
        delThread(r);
      } else if (this.className.indexOf("no") !== -1){
        pendingDel = null;
        drawThreads();
      } else {
        pendingDel = this.getAttribute("data-del");
        drawThreads();
      }
    };
  }
  document.getElementById("newthread").onclick = openInvite;
  drawBar();
}

/* ── 招待画面 ── */
function openInvite(){
  picked = [];
  show("invite");
  drawInvite();
}
function drawInvite(){
  var byOrg = {};
  for (var i = 0; i < roster.length; i++){
    var r = roster[i];
    (byOrg[r.org] = byOrg[r.org] || []).push(r);
  }
  var h = '<input id="tname" placeholder="\u03cc\u03bd\u03bf\u03bc\u03b1">';
  h += "<h3>tap to invite</h3>";
  for (var org in byOrg){
    h += '<div class="org">' + esc(org) + "</div>";
    for (var j = 0; j < byOrg[org].length; j++){
      var m = byOrg[org][j];
      var on = picked.indexOf(m.id) !== -1;
      h += '<div class="card' + (on ? " on" : "") + '" data-id="' + esc(m.id) + '">'
        + '<span class="f">' + m.flag + "</span>"
        + '<span class="m"><b>' + esc(m.label) + (m.preferred ? ' <span class="star">\u2726</span>' : "")
        + "</b><small>" + esc(m.home) + "</small></span>"
        + '<span class="k">~' + m.room + ' turns/day</span></div>';
    }
  }
  h += '<button id="go">\u03c0\u03ac\u03bc\u03b5 \u03c0\u03b1\u03c1\u03ad\u03b1</button>';
  $invite.innerHTML = h;

  var cs = $invite.querySelectorAll(".card");
  for (var k = 0; k < cs.length; k++){
    cs[k].onclick = function(){
      var id = this.getAttribute("data-id");
      var at = picked.indexOf(id);
      if (at === -1) picked.push(id); else picked.splice(at, 1);
      var name = document.getElementById("tname").value;
      drawInvite();
      document.getElementById("tname").value = name;
    };
  }
  document.getElementById("go").onclick = createThread;
  drawBar();
}

function createThread(){
  if (!picked.length) return;
  var name = document.getElementById("tname").value.trim();
  var id = "r" + Date.now().toString(36);
  fetch(WORKER + "/threads", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ room: id, title: name, seats: picked })
  }).then(function(){
    return loadThreads();
  }).then(function(){
    enter(id);
  })["catch"](function(){ faults["_"] = "\u4f5c\u308c\u306a\u304b\u3063\u305f"; });
}

function delThread(id){
  fetch(WORKER + "/threads?room=" + id, { method: "DELETE" })
    .then(loadThreads)["catch"](function(){});
}

function loadThreads(){
  return fetch(WORKER + "/threads").then(function(r){ return r.json(); })
    .then(function(d){ threads = d.threads || []; drawThreads(); });
}

/* ── 部屋に入る ── */
function enter(id){
  var t = null;
  for (var i = 0; i < threads.length; i++) if (threads[i].room === id) t = threads[i];
  if (!t) return;
  room = id; title = t.title; calls = 0; faults = {}; openCard = null;
  members = t.seats.map(function(s, i){
    var r = infoOf(s) || { label: s, flag: "", org: "", home: "" };
    return { id: s, label: r.label, flag: r.flag, org: r.org, home: r.home,
             tint: TINTS[i % TINTS.length], name: "", fatigue: 0, out: false };
  });
  show("chat");
  drawBar();
  $log.innerHTML = "";
  fetch(WORKER + "/log?room=" + room).then(function(r){ return r.json(); })
    .then(function(d){
      msgs = (d.log || []).map(function(x){
        return { id: String(x.id), who: x.who || "", seat: x.seat || "",
                 text: x.text, named: !!x.named, leaving: !!x.leaving };
      });
      for (var i = 0; i < members.length; i++){
        for (var j = msgs.length - 1; j >= 0; j--){
          if (msgs[j].seat === members[i].id && msgs[j].named && msgs[j].who){
            members[i].name = msgs[j].who; break;
          }
        }
      }
      drawBar(); drawLog();
    })["catch"](function(){ faults["_"] = "\u8aad\u3081\u306a\u304b\u3063\u305f"; drawLog(); });
}

/* ── 会話 ── */
function drawLog(){
  var h = "";
  for (var i = 0; i < msgs.length; i++){
    var m = msgs[i];
    var mine = m.seat === "me";
    var s = mine ? null : seatOf(m.seat);
    var tint = mine ? "rgba(255,255,255,0.5)" : (s ? s.tint : "rgba(255,255,255,0.4)");
    var label = (mine || m.named)
      ? '<span style="color:' + tint + '">' + esc(m.who) + "</span>"
      : '<span class="pip" style="background:' + tint + '"></span>';
    h += '<div class="msg' + (m.leaving ? " leaving" : "") + '">'
      + '<div class="name" data-i="' + i + '">' + label + "</div>";
    if (openCard === i){
      h += '<div class="card-id" data-close="1">'
        + (mine
            ? "human \u30fb Japan \u30fb he"
            : (s ? s.flag + " " + esc(s.org) + " \u30fb " + esc(s.label) + " \u30fb " + esc(s.home) : "?"))
        + "</div>";
    }
    h += '<div class="body">' + esc(m.text) + "</div></div>";
  }
  var fe = "";
  for (var f in faults){
    if (faults[f]) fe += '<div class="fault">' + esc(f + ": " + faults[f]) + "</div>";
  }
  var tip = "";
  if (busy && thinker){
    tip = '<span class="dot" style="background:' + thinker.tint
      + ';width:7px;height:7px;vertical-align:middle;display:inline-block;margin-right:6px"></span>'
      + esc(thinker.name || thinker.label)
      + ' <span class="typing"><i></i><i></i><i></i></span>';
  } else if (busy){
    tip = '<span class="typing"><i></i><i></i><i></i></span>';
  }
  h += '<div id="think">' + tip + fe + "</div>";
  $log.innerHTML = h;

  var cc = $log.querySelectorAll(".card-id");
  for (var w = 0; w < cc.length; w++){
    cc[w].onclick = function(){ openCard = null; drawLog(); };
  }
  var ns = $log.querySelectorAll(".name");
  for (var q = 0; q < ns.length; q++){
    ns[q].onclick = function(){
      var i = Number(this.getAttribute("data-i"));
      openCard = openCard === i ? null : i;
      drawLog();
    };
  }
  $log.scrollTop = $log.scrollHeight;
}

function rename(){
  if (view !== "chat") return;
  var n = prompt("\u03cc\u03bd\u03bf\u03bc\u03b1", title || "");
  if (n === null) return;
  title = n.trim();
  var seats = members.map(function(m){ return m.id; });
  fetch(WORKER + "/threads", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ room: room, title: title, seats: seats })
  }).then(function(){ drawBar(); })["catch"](function(){});
}

function keep(e){
  fetch(WORKER + "/log?room=" + room, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(e)
  })["catch"](function(){});
}

function ask(seat, called){
  var me = seatOf(seat);
  if (!me || me.out) return Promise.resolve(null);
  thinker = me; drawLog();
  var roll = members.map(function(m){ return { name: m.name, out: m.out }; });
  var tail = msgs.slice(-14).map(function(m){ return { who: m.who, text: m.text }; });

  return fetch(WORKER + "/speak?room=" + room, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ seat: seat, name: me.name, fatigue: me.fatigue,
                           called: called, members: roll, log: tail })
  }).then(function(r){ return r.json(); }).then(function(data){
    calls++;
    if (data.error){
      faults[me.label] = String(data.error).slice(0, 120);
      drawBar(); drawLog(); return null;
    }
    var out = data.out || {};
    faults[me.label] = "";
    var nm = (out.name || "").trim();

    for (var k = 0; k < members.length; k++){
      if (members[k].id === seat){
        if (nm) members[k].name = nm;
        if (out.leaving) members[k].out = true;
        members[k].fatigue = Math.min(1, members[k].fatigue + (out.speak ? TIRE : LISTEN));
      } else {
        members[k].fatigue = Math.max(0, members[k].fatigue - REST);
      }
    }

    if (out.leaving){
      var bye = { who: nm || me.name || "", seat: seat, named: !!(nm || me.name),
                  text: (out.text || "").trim() || "\u5c11\u3057\u4f11\u3080", leaving: true };
      msgs.push(bye); keep(bye); drawBar(); drawLog();
      return null;
    }
    if (!out.speak || !out.text){ drawBar(); drawLog(); return { called: null, stay: false }; }

    var text = out.text.trim();
    var e = { who: nm || me.name || "", seat: seat, text: text, named: !!(nm || me.name) };
    msgs.push(e); keep(e); drawBar(); drawLog();

    var hit = null;
    for (var n = 0; n < members.length; n++){
      var o = members[n];
      if (o.id !== seat && !o.out && o.name && text.indexOf("@" + o.name) !== -1) hit = o.id;
    }
    return { called: hit, stay: !!out.stay };
  })["catch"](function(){
    faults[me.label] = "\u5c4a\u304b\u306a\u304b\u3063\u305f"; drawLog(); return null;
  });
}

function runRound(seed){
  busy = true; drawLog();
  var order = members.slice().sort(function(){ return Math.random() - 0.5; });
  var next = null, d = 0;

  function opening(i){
    if (i >= order.length) return Promise.resolve();
    return ask(order[i].id, seed ? seed === order[i].id : false).then(function(r){
      if (r && !next){
        if (r.called) next = { seat: r.called, called: true };
        else if (r.stay) next = { seat: order[i].id, called: false };
      }
      return opening(i + 1);
    });
  }
  function chain(){
    if (!next || d >= maxDepth) return Promise.resolve();
    d++;
    var cur = next;
    return ask(cur.seat, cur.called).then(function(r){
      if (!r){ next = null; return; }
      if (r.called) next = { seat: r.called, called: true };
      else if (r.stay) next = { seat: cur.seat, called: false };
      else next = null;
      return chain();
    });
  }
  return opening(0).then(chain).then(function(){ busy = false; thinker = null; drawLog(); });
}

function send(){
  var t = $say.value.trim();
  if (!t || busy) return;
  var mine = { who: "\u3057\u3085\u3046", seat: "me", text: t, named: true };
  msgs.push(mine); keep(mine); $say.value = ""; drawLog();
  var seed = null;
  for (var i = 0; i < members.length; i++){
    var m = members[i];
    if (!m.out && m.name && t.indexOf("@" + m.name) !== -1) seed = m.id;
  }
  runRound(seed);
}

$say.addEventListener("focus", function(){
  setTimeout(function(){ if (view === "chat") $log.scrollTop = $log.scrollHeight; }, 260);
});

$send.onclick = send;
$back.onclick = function(){
  if (view === "chat" || view === "invite"){ show("threads"); loadThreads(); }
};

/* ── 起動 ── */
fetch(WORKER + "/roster").then(function(r){ return r.json(); }).then(function(d){
  roster = d.roster || [];
  return loadThreads();
})["catch"](function(e){
  $threads.innerHTML = '<div class="fault">\u3064\u306a\u304c\u3089\u306a\u304b\u3063\u305f: ' + esc(e) + "</div>";
});
</script>
